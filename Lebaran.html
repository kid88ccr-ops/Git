<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebaran</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #134e5e, #71b280);
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h2 {
            font-size: 38px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* VIDEO */
        .video-container {
            text-align: center;
            padding: 20px;
        }

        .video-container video {
            width: 80%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* GALERI */
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* tombol home */
        .floating-home {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffd700;
            color: black;
            padding: 15px;
            border-radius: 50%;
            font-size: 20px;
            text-decoration: none;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .floating-home:hover {
            transform: scale(1.1);
        }
    </style>
</head>
